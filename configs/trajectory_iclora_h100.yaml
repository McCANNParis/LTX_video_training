# H100 Optimized IC-LoRA Training Configuration for Trajectory-Guided LTX Video
# Leverages H100's 80GB VRAM for maximum quality and speed
# Optimized for: NVIDIA H100 80GB PCIe/SXM

# Model Configuration
model:
  model_name: "Lightricks/LTX-Video"
  model_version: "LTXV_13B_097_DEV"  # 13B model for best quality
  pretrained_model_name_or_path: "Lightricks/LTX-Video"
  variant: "bf16"  # Use bfloat16 for H100 tensor cores
  cache_dir: "./models"

  # Training mode
  training_mode: "iclora"  # IC-LoRA for trajectory conditioning

  # Transformer configuration - H100 optimized
  transformer:
    load_in_8bit: false  # H100 has enough VRAM for full precision
    enable_gradient_checkpointing: true  # Still beneficial for memory
    enable_slicing: false  # Disable for speed on H100
    enable_tiling: false   # Disable for speed on H100

  # VAE configuration
  vae:
    load_in_8bit: false  # Full precision on H100
    enable_slicing: false
    enable_tiling: false

  # Text encoder configuration
  text_encoder:
    load_in_8bit: false  # Full precision
    load_in_4bit: false

# LoRA Configuration - Higher rank for H100
lora:
  rank: 512  # 2x higher rank for H100 - captures more complex patterns
  alpha: 512  # Match rank for 1:1 scaling
  dropout: 0.05  # Lower dropout for cleaner gradients
  bias: "none"
  target_modules:
    # Attention layers
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    # Additional layers for finer control
    - "add_k_proj"
    - "add_v_proj"

  # Module configuration
  modules_to_save: []
  init_lora_weights: true

# IC-LoRA Conditioning Configuration
conditioning:
  mode: "reference_video"  # IC-LoRA mode

  # Conditioning probability
  conditioning_prob: 0.9  # Higher conditioning rate for H100

  # Reference video (trajectory) configuration
  reference_video:
    enabled: true
    num_reference_frames: -1  # Use all frames
    reference_conditioning_scale: 1.0

  # First frame conditioning
  first_frame_conditioning: true
  first_frame_conditioning_prob: 0.95

  # Conditioning augmentation
  augmentation:
    enabled: true
    dropout_prob: 0.05
    noise_std: 0.02  # Lower noise for higher quality
    temporal_masking_prob: 0.03

# Dataset Configuration
dataset:
  # Data paths
  data_root: "/workspace/LTX_video_training/dataset"
  train_csv: "/workspace/LTX_video_training/dataset/train.csv"

  # Column names in CSV
  video_column: "video_path"
  reference_video_column: "trajectory_path"
  caption_column: "caption_path"

  # Video parameters - Full quality on H100
  num_frames: 121  # ~4 seconds at 30fps
  frame_stride: 1
  fps: 30

  # Multi-resolution training (aspect ratio buckets)
  enable_resolution_buckets: true
  resolution_buckets:
    - [512, 896]   # Vertical (9:16)
    - [704, 1216]  # Cinematic (16:9)
    - [896, 512]   # Horizontal (16:9)
    - [768, 768]   # Square
    - [640, 1024]  # Tall cinematic

  # Default resolution
  resolution: [704, 1216]

  # Data augmentation
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    color_jitter:
      enabled: true
      brightness: 0.05
      contrast: 0.05
      saturation: 0.05
      hue: 0.02
    temporal_crop: true
    spatial_crop: true

  # Dataloader - H100 optimized
  dataloader_num_workers: 16  # More workers for H100's PCIe bandwidth
  pin_memory: true
  prefetch_factor: 4  # Higher prefetch for speed

# Optimization Configuration - H100 optimized
optimization:
  # Learning rate
  learning_rate: 1e-4  # Higher LR for H100's larger batches
  scale_lr: false

  # Training steps
  max_train_steps: 10000  # Can adjust based on dataset size
  gradient_accumulation_steps: 2  # Lower since we can fit larger batches

  # Batch size - H100 can handle larger batches
  train_batch_size: 4  # 4x larger than 24GB config

  # Gradient clipping
  max_grad_norm: 1.0  # Slightly looser for larger batches

  # Optimizer
  optimizer_type: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1e-8

  # Use standard Adam on H100 (no need for 8-bit)
  use_8bit_adam: false

  # Learning rate scheduler
  lr_scheduler: "cosine_with_restarts"
  lr_warmup_steps: 500
  lr_num_cycles: 3

  # Exponential Moving Average (EMA)
  use_ema: true
  ema_decay: 0.9999
  ema_power: 0.75

# Acceleration Configuration - H100 specific
acceleration:
  # Mixed precision - bf16 optimal for H100
  mixed_precision: "bf16"

  # PyTorch 2.0 compilation - H100 benefits greatly
  enable_torch_compile: true  # Enable for H100!
  torch_compile_backend: "inductor"
  torch_compile_mode: "max-autotune"  # Aggressive optimization

  # Gradient checkpointing
  gradient_checkpointing: true

  # Memory optimizations
  enable_xformers_memory_efficient_attention: true
  allow_tf32: true  # H100 tensor cores

  # H100 specific optimizations
  use_fused_adam: true  # Fused kernels for speed
  use_flash_attention_2: true  # Flash Attention 2 for H100

# Validation Configuration
validation:
  enabled: true
  validation_steps: 250  # More frequent on H100
  num_validation_videos: 4

  # Validation prompts
  validation_prompts:
    - "A person walking towards the camera in a park"
    - "Camera panning across a beautiful cityscape at sunset"
    - "A car driving down a winding mountain road"
    - "Autumn leaves falling and swirling in the wind"

  # Save best model
  save_best_model: true
  metric: "lpips"

  # Video generation settings
  guidance_scale: 7.5
  num_inference_steps: 50

# Checkpointing Configuration
checkpointing:
  # Save frequency - Save every 250 steps for small dataset
  checkpointing_steps: 250
  save_steps: 250

  # Keep more checkpoints for small dataset
  keep_last_n_checkpoints: 10  # Keep last 10 checkpoints

  # Also save at specific milestones
  save_at_steps: [500, 1000, 2000, 3000, 5000, 7500, 10000]

  # Save optimizer state (allows full resume)
  save_optimizer_state: true

  # Save EMA weights separately
  save_ema_model: true

  # Resume from checkpoint
  resume_from_checkpoint: null  # "latest" to auto-resume

  # Output directory
  output_dir: "/workspace/LTX_video_training/output/trajectory_iclora_h100"

  # Checkpoint naming
  checkpoint_name_format: "checkpoint-{step}"  # e.g., checkpoint-1000

# Logging Configuration
logging:
  # Logging frequency
  logging_steps: 10
  report_to: "tensorboard"  # Can change to "wandb"

  # Project name
  project_name: "ltxv-trajectory-guided-h100"
  run_name: null  # Auto-generated

  # Weights & Biases (optional)
  wandb:
    entity: null  # Your W&B username
    tags:
      - "ltx-video"
      - "iclora"
      - "trajectory-guided"
      - "h100"
    notes: "H100-optimized trajectory-guided video generation"

  # Log metrics
  log_metrics:
    - "trajectory_fidelity"
    - "motion_smoothness"
    - "temporal_consistency"

  # Save samples
  save_sample_images: true
  sample_images_steps: 250

# Experimental Features
experimental:
  # Trajectory quality metrics
  compute_trajectory_metrics: true

  # Temporal consistency loss
  use_temporal_consistency_loss: true
  temporal_consistency_loss_weight: 0.05

  # H100 experimental features
  use_cuda_graphs: true  # CUDA graphs for H100
  use_nvfuser: true      # NVFuser for kernel fusion

# System Configuration
system:
  # Seed for reproducibility
  seed: 42

  # H100 specific settings
  num_processes: null  # Auto-detect

  # Distributed training
  distributed_training: true

  # Enable TF32 for H100
  allow_tf32: true

  # CUDA configuration
  cudnn_benchmark: true
  cudnn_deterministic: false

  # H100 memory optimization
  empty_cache_steps: 100  # Regular cache clearing

# Training Strategy for Small Dataset (21 videos)
training_strategy:
  # With 21 videos, use aggressive augmentation and longer training
  overfit_prevention:
    enabled: true
    strategies:
      - "aggressive_augmentation"
      - "dropout_regularization"
      - "early_stopping"

  # Early stopping
  early_stopping:
    enabled: true
    patience: 2000  # Stop if no improvement for 2000 steps
    monitor: "validation_lpips"
    min_delta: 0.001

  # For small datasets, consider these adjustments:
  # - Lower max_train_steps (maybe 5000-7000)
  # - Higher augmentation
  # - More validation frequency
  # - Monitor for overfitting
