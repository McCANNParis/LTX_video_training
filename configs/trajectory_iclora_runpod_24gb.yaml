# RunPod Configuration for 24GB GPUs (RTX 4090, RTX 3090, A5000)
# Optimized for memory efficiency

# Model Configuration
model:
  model_name: "Lightricks/LTX-Video"
  model_version: "LTXV_13B_097_DEV"
  pretrained_model_name_or_path: "Lightricks/LTX-Video"
  variant: "bf16"
  cache_dir: "/workspace/.cache/models"

  training_mode: "iclora"

  # Aggressive memory optimization
  transformer:
    load_in_8bit: true  # INT8 quantization
    enable_gradient_checkpointing: true
    enable_slicing: true
    enable_tiling: true

  vae:
    load_in_8bit: true
    enable_slicing: true
    enable_tiling: true

  text_encoder:
    load_in_8bit: true

# LoRA Configuration
lora:
  rank: 128  # Reduced from 256 for memory
  alpha: 128
  dropout: 0.1
  bias: "none"
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# IC-LoRA Conditioning
conditioning:
  mode: "reference_video"
  conditioning_prob: 0.85
  reference_video:
    enabled: true
    num_reference_frames: -1
    reference_conditioning_scale: 1.0
  first_frame_conditioning: true
  first_frame_conditioning_prob: 0.9
  augmentation:
    enabled: true
    dropout_prob: 0.1
    noise_std: 0.05

# Dataset Configuration
dataset:
  data_root: "/workspace/LTX_video_training/dataset"
  train_csv: "/workspace/LTX_video_training/dataset/train.csv"
  video_column: "video_path"
  reference_video_column: "trajectory_path"
  caption_column: "caption_path"

  # Reduced for memory
  num_frames: 91  # 3 seconds at 30fps (reduced from 121)
  frame_stride: 1
  fps: 30

  # Smaller resolution options
  enable_resolution_buckets: true
  resolution_buckets:
    - [512, 512]   # Square
    - [512, 896]   # Vertical
    - [704, 704]   # Square larger

  augmentation:
    enabled: true
    horizontal_flip: 0.5
    color_jitter:
      enabled: true
      brightness: 0.1
      contrast: 0.1
    temporal_crop: true

  dataloader_num_workers: 4
  pin_memory: true
  prefetch_factor: 2

# Optimization Configuration
optimization:
  learning_rate: 8e-5
  scale_lr: false

  max_train_steps: 5000  # Reduced for 24GB GPU
  gradient_accumulation_steps: 16  # High accumulation for effective batch size

  train_batch_size: 1  # Must be 1 for 24GB

  max_grad_norm: 0.5

  # 8-bit optimizer is essential
  optimizer_type: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1e-8
  use_8bit_adam: true  # Required

  lr_scheduler: "cosine"
  lr_warmup_steps: 500

  use_ema: false  # Disabled to save memory
  # ema_decay: 0.9999

# Acceleration
acceleration:
  mixed_precision: "bf16"
  enable_torch_compile: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: true
  allow_tf32: true

# Validation
validation:
  enabled: true
  validation_steps: 500
  num_validation_videos: 2  # Reduced from 4

  validation_prompts:
    - "A person walking towards the camera"
    - "Camera panning across a landscape"

  save_best_model: true
  metric: "lpips"
  guidance_scale: 7.5
  num_inference_steps: 25  # Reduced for faster validation

# Checkpointing
checkpointing:
  checkpointing_steps: 500
  save_steps: 500
  keep_last_n_checkpoints: 3  # Save disk space
  save_optimizer_state: false  # Save disk space
  resume_from_checkpoint: null
  output_dir: "/workspace/LTX_video_training/output/trajectory_iclora_24gb"

# Logging
logging:
  logging_steps: 10
  report_to: "tensorboard"  # or "wandb"
  project_name: "ltxv-trajectory-24gb"
  run_name: null

  wandb:
    entity: null
    tags:
      - "ltx-video"
      - "iclora"
      - "24gb-gpu"

  log_metrics:
    - "trajectory_fidelity"
    - "temporal_consistency"

  save_sample_images: true
  sample_images_steps: 500

# Experimental
experimental:
  compute_trajectory_metrics: true
  multi_scale_training: false
  use_physics_loss: false
  use_temporal_consistency_loss: false  # Disabled to save memory

# System
system:
  seed: 42
  num_processes: null
  distributed_training: false  # Single GPU
  allow_tf32: true
  cudnn_benchmark: true
  cudnn_deterministic: false
